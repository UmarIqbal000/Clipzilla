[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipzilla"
version = "0.1.0"
description = "Clipzilla — monster that devours long-form and spits out shorts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Clipzilla Team"}
]
keywords = ["youtube", "shorts", "clipper", "whisper", "ffmpeg", "transcription"]
dependencies = [
    "click>=8.1.0",
    "yt-dlp>=2024.0.0",
    "faster-whisper>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
clipzilla = "clipzilla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
